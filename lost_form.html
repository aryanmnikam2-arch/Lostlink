{% extends "base.html" %}
{% block title %}Report Lost Item — VIT Bhopal Lost & Found{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-card">

    <div class="form-card-header">
      <div class="badge">😟 Lost Item Report</div>
      <h2>Report a Lost Item</h2>
      <p>Fill in the details below. Our AI will scan found items for probable matches.</p>
    </div>

    <div class="form-body">
      <form method="POST" action="{{ url_for('lost_new') }}" enctype="multipart/form-data" novalidate>

        <div class="form-group">
          <label for="item_name">Item Name <span class="req">*</span></label>
          <input
            id="item_name"
            type="text"
            name="item_name"
            class="form-control"
            placeholder="e.g. Blue Campus ID Card"
            value="{{ form_data.get('item_name','') }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="description">Description <span class="req">*</span></label>
          <textarea
            id="description"
            name="description"
            class="form-control"
            placeholder="Describe the item in detail — colour, brand, distinguishing marks…"
            required
          >{{ form_data.get('description','') }}</textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="registration_number">Registration No. <span class="req">*</span></label>
            <input
              id="registration_number"
              type="text"
              name="registration_number"
              class="form-control"
              placeholder="e.g. 22BCE1234"
              value="{{ form_data.get('registration_number','') }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="contact_details">Contact Details <span class="req">*</span></label>
            <input
              id="contact_details"
              type="text"
              name="contact_details"
              class="form-control"
              placeholder="Phone / WhatsApp number"
              value="{{ form_data.get('contact_details','') }}"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>Item Photo <small style="color:var(--text-muted);font-weight:400;">(optional)</small></label>
          <label for="image" class="file-upload-label">
            <span class="upload-icon">🖼️</span>
            <span class="upload-title">Click to upload a photo</span>
            <span class="upload-sub">PNG, JPG, WEBP — max {{ config.get('MAX_UPLOAD_MB', 5) }} MB</span>
          </label>
          <input id="image" type="file" name="image" accept="image/*" />
          <div class="file-preview">
            <img src="" alt="Preview" />
          </div>
        </div>

        <div class="form-footer">
          <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">← Back</a>
          <button type="submit" class="btn btn-primary">
            <span class="btn-text">🔍 Submit &amp; Find Matches</span>
            <span class="spinner"></span>
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
